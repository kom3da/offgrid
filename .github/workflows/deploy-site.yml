# Build the docs site (site/ + docs/) and deploy it to GitHub Pages.
# The build output is uploaded as an artifact, so nothing built is committed.
name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "drills/**/TASKS.md"
      - "prompts/**"
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only the template repository publishes the site; copies made from the template skip this
    if: github.repository == 'kom3da/offgrid'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          path: site
          node-version: 22
          # The Astro content cache produced stale stylesheet hashes locally; build clean every time.
          cache: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
