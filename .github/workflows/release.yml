# 版のタグを push したら、学習用コマンドのバイナリを作ってリリースに添える。
# カリキュラムの版とツールの版が、いつも同じ番号になる。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースを作るタグ（例: v1.0.2）"
        required: true

permissions:
  contents: write

jobs:
  build:
    # テンプレートのリポジトリでだけ動かす
    if: github.repository == 'kom3da/offgrid'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          # 外部の依存が無いので、キャッシュするものもない
          cache: false

      - name: 版を決める
        id: ver
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 検査
        working-directory: tools/offgrid
        run: |
          go vet ./...
          go test ./...
          go run . selftest

      - name: バイナリを作る
        working-directory: tools/offgrid
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p dist
          # Learners run the tool inside Ubuntu (docs/02), so linux is what they install.
          # darwin is built for maintaining the curriculum from a Mac.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/offgrid-${os}-${arch}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "$out" .
            ( cd dist && sha256sum "$(basename "$out")" >> checksums.txt )
          done
          ls -l dist

      # ノートは CHANGELOG.md から作る。手で書くと、CHANGELOG と食い違う
      - name: ノートを作る
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "（" {f=1; next}
            f && /^## / {exit}
            f {print}
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "error: CHANGELOG.md に「## ${TAG}（…）」の節がありません" >&2
            exit 1
          fi
          cat >> /tmp/notes.md <<'EOF'

          ## 入れかた

          学習はUbuntuの中で行うので、その中で実行する。

          ```sh
          case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; x86_64|amd64) arch=amd64 ;; esac
          curl -fsSL -o ~/.local/bin/offgrid \
            "https://github.com/kom3da/offgrid/releases/latest/download/offgrid-linux-$arch"
          chmod +x ~/.local/bin/offgrid && offgrid version
          ```

          `checksums.txt` で確かめられる。カリキュラムの取り込みは `./scripts/update-curriculum.sh` に、この版を渡す。全手順は [はじめかた](https://github.com/kom3da/offgrid/blob/main/docs/02-getting-started.md)。
          EOF
          cat /tmp/notes.md

      - name: リリースに添える
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # 先にリリースだけ作る。資産を一緒に渡すと、1つのアップロードが失敗した時点で
          # リリースごと作られない（GitHub の upload API は 500 を返すことがある）
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi

          # 1つずつ上げ、失敗したものだけ入れ直す
          for f in tools/offgrid/dist/*; do
            ok=
            for try in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then ok=1; break; fi
              echo "::warning::$(basename "$f") のアップロードに失敗（${try}/3）。待って再試行する"
              sleep 15
            done
            [ -n "$ok" ] || { echo "::error::$(basename "$f") を上げられませんでした"; exit 1; }
          done

          # 欠けたまま公開されるのを防ぐ（実際に1つ欠けたことがある）
          want=$(ls tools/offgrid/dist | wc -l | tr -d ' ')
          got=$(gh release view "$TAG" --json assets --jq '.assets|length')
          echo "資産: $got / $want"
          if [ "$got" != "$want" ]; then
            echo "::error::資産が $want 件そろっていません（$got 件）"
            gh release view "$TAG" --json assets --jq '.assets[].name'
            exit 1
          fi
