# カリキュラムの文書の検査。docs だけ変えたときも、ここが関門になる。
# 止めたいのは、ルールを変えたときの取り残し、リンク切れ、数の食い違い。
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "drills/**/TASKS.md"
      - "prompts/**"
      - "templates/**"
      - "README.md"
      - "CLAUDE.md"
      - "PROGRESS.md"
      - ".github/check-docs.py"
      - ".github/workflows/docs.yml"
  # PR では絞り込まない。必須チェックにしているので、走らないと
  # 「待ち」のまま止まってしまう（paths で絞ると、それが起きる）
  pull_request:
  workflow_dispatch:

jobs:
  check:
    if: github.repository == 'kom3da/offgrid'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 別の PR のコミットを含むかを見るのに、履歴が要る

      # 別の PR のブランチの上に切った PR は、そちらがマージされた瞬間に
      # こちらも「マージ済み」になり、レビューされていないコミットが main に入る（実際に起きた）
      - name: 別の PR の上に切っていないか
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gh pr list --state open --json number,headRefOid \
            --jq '.[] | "\(.number) \(.headRefOid)"' > /tmp/open-prs.txt
          bad=0
          while read -r num sha; do
            [ "$num" = "$PR" ] && continue
            if git merge-base --is-ancestor "$sha" HEAD && ! git merge-base --is-ancestor "$sha" "$BASE"; then
              echo "::error::この PR は #$num のブランチの上に切られています（#$num の $sha を含む）。main から切り直してください"
              bad=1
            fi
          done < /tmp/open-prs.txt
          [ "$bad" = 0 ]

      - name: リンク・引退した言い回し・数の整合
        run: python3 .github/check-docs.py
      # テンプレートのコミットは範囲でタグを付ける（README のコミット規約）。
      # 学習者側の [no-ai]/[ai]/[mixed]/[docs] に戻らないよう、題名で止める。
      - name: PRの題名のタグ
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$TITLE" in
            "[curriculum] "*|"[tool] "*|"[site] "*|"[meta] "*) echo "OK: $TITLE" ;;
            *)
              echo "::error::題名を [curriculum] / [tool] / [site] / [meta] で始めてください（いま: $TITLE）"
              echo "学習者側の [no-ai] / [ai] / [mixed] / [docs] は、テンプレートでは使いません"
              exit 1 ;;
          esac

      - name: シェルスクリプト
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh
